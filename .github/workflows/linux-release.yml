name: Linux Multi-Distro Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - 'LICENSE'
      - 'macOS_Build.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - 'LICENSE'
      - 'macOS_Build.md'
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build & Test (${{ matrix.distro }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - distro: ubuntu
            arch: x86_64
            runs_on: ubuntu-latest
            container: ubuntu:latest
          - distro: fedora
            arch: x86_64
            runs_on: ubuntu-latest
            container: fedora:latest
          - distro: ubuntu
            arch: aarch64
            runs_on: ubuntu-24.04-arm
            container: ubuntu:24.04
          - distro: fedora
            arch: aarch64
            runs_on: ubuntu-24.04-arm
            container: fedora:latest
      fail-fast: false
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prep Ubuntu
        if: matrix.distro == 'ubuntu'
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake build-essential pkg-config fcitx5 libfcitx5core-dev qtbase5-dev qt5-qmake qttools5-dev-tools libqt5svg5-dev dpkg-dev fakeroot lintian rpm xvfb procps

      - name: Prep Fedora
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y git cmake gcc-c++ make pkgconf fcitx5-devel qt5-qtbase-devel qt5-qttools-devel qt5-qtsvg-devel rpm-build xorg-x11-server-Xvfb procps-ng

      - name: Configure CMake
        run: |
          # Extract version from Git tag (GITHUB_REF_NAME) or default to 0.0.0
          REF_NAME="${GITHUB_REF_NAME:-}"
          if echo "$REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION=$(echo "$REF_NAME" | sed 's/^v//' | sed 's/-.*//')
          else
            VERSION="0.0.0"
          fi
          echo "Resolved version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV # Export VERSION for subsequent steps
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENKEY_VERSION="$VERSION"

      - name: Tier 1 - Compile native C++ (Core Engine, Fcitx5 hook, Qt5 UI)
        run: cmake --build build --parallel

      - name: Package with CPack (DEB)
        if: matrix.distro == 'ubuntu'
        run: |
          # Re-configure to force the specific multiarch /usr/lib/x86_64-linux-gnu path
          # This is critical for Ubuntu/Debian discovery
          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          cmake -B build -S . -DCMAKE_INSTALL_LIBDIR="lib/$MULTIARCH" -DOPENKEY_VERSION="${{ env.VERSION }}"
          cd build && cpack -G DEB

      - name: Package with CPack (RPM)
        if: matrix.distro == 'fedora'
        run: |
          # RPM usually prefers lib64 or follows system defaults, which is fine for Fedora matrix
          cd build && cpack -G RPM

      - name: Tier 2 & 3 - Smoke Install & Run
        run: |
          if [ "${{ matrix.distro }}" = "ubuntu" ]; then
            dpkg -i build/openkey-*.deb || apt-get install -f -y
          fi
          if [ "${{ matrix.distro }}" = "fedora" ]; then
            rpm -ivh build/openkey-*.rpm --nodeps
          fi
          
          # Test headless UI launch
          xvfb-run --auto-servernum openkey-linux-ui &
          sleep 2
          pkill -f openkey-linux || true

      - name: Generate SHA256 checksums
        run: |
          cd build
          sha256sum openkey-cli *.deb *.rpm > SHA256SUMS-${{ matrix.distro }}-${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkey-linux-packages-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            build/openkey-cli
            build/*.deb
            build/*.rpm
            build/SHA256SUMS-*

  release:
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/
          pattern: openkey-linux-packages-*
          merge-multiple: true

      - name: Import GPG signing key
        id: import_gpg
        if: ${{ env.GPG_PRIVATE_KEY != '' && env.GPG_PASSPHRASE != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Sign release checksums
        if: ${{ steps.import_gpg.conclusion == 'success' }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --output build/SHA256SUMS.sig --detach-sign build/SHA256SUMS
        env:
          GPG_PASSPHRASE: ${{ env.GPG_PASSPHRASE }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/openkey-cli
            build/*.deb
            build/*.rpm
            build/SHA256SUMS-*
            build/SHA256SUMS.sig
          generate_release_notes: true
