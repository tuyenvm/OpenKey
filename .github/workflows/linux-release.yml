name: Linux Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - 'LICENSE'
      - 'macOS_Build.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agent/**'
      - 'LICENSE'
      - 'macOS_Build.md'
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run Linux build"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test (version)
        run: ./build/openkey-cli --version

      - name: Smoke test (engine)
        run: ./build/openkey-cli --test

      - name: Generate SHA256 checksum
        run: |
          cd build
          sha256sum openkey-cli > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkey-cli-linux-x86_64
          path: |
            build/openkey-cli
            build/SHA256SUMS

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake build-essential

      - name: Build Release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Smoke test
        run: |
          ./build/openkey-cli --version
          ./build/openkey-cli --test

      - name: Generate SHA256 checksum
        run: |
          cd build
          sha256sum openkey-cli > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/openkey-cli
            build/SHA256SUMS
          generate_release_notes: true
